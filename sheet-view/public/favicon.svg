<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Sheet-View</title>
  <g stroke="#4a2e1a" stroke-width="1.1" stroke-linejoin="round">
    <!-- body -->
    <path fill="#dc9058" d="M16 12.5c4.6 0 8.5 4.3 8.5 9.4S20.9 30.5 16 30.5 7.5 27 7.5 21.9 11.4 12.5 16 12.5Z"/>
    <!-- neck -->
    <rect fill="#a9683b" x="13.7" y="5.5" width="4.6" height="12" rx="1"/>
    <!-- headstock -->
    <rect fill="#a9683b" x="12.3" y="1.5" width="7.4" height="5" rx="1.6"/>
  </g>
  <!-- nut -->
  <rect fill="#4a2e1a" x="13.4" y="5.1" width="5.2" height="1.2" rx="0.4"/>
  <!-- tuning pegs -->
  <g fill="#4a2e1a">
    <circle cx="11.8" cy="2.9" r="1"/>
    <circle cx="11.8" cy="5.1" r="1"/>
    <circle cx="20.2" cy="2.9" r="1"/>
    <circle cx="20.2" cy="5.1" r="1"/>
  </g>
  <!-- sound hole -->
  <circle fill="#3a2416" cx="16" cy="21.4" r="2.7"/>
  <!-- bridge -->
  <rect fill="#4a2e1a" x="12.4" y="25.4" width="7.2" height="1.8" rx="0.7"/>
  <!-- strings -->
  <g stroke="#f5e6d3" stroke-width="0.7" stroke-linecap="round">
    <line x1="14.4" y1="3" x2="14.4" y2="25.6"/>
    <line x1="15.5" y1="3" x2="15.5" y2="25.6"/>
    <line x1="16.5" y1="3" x2="16.5" y2="25.6"/>
    <line x1="17.6" y1="3" x2="17.6" y2="25.6"/>
  </g>
</svg>
